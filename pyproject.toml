[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "noti_son"
version = "0.0.1"
description = "Analisis de lenguaje natural de las noticias de la Unison"
authors = [
  { name = "Moreno Esparza J. A." },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "==3.12.2"


[tool.ruff]
line-length = 99
src = ["noti_son"]
include = ["pyproject.toml", "noti_son/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["noti_son"]
force-sort-within-sections = true

